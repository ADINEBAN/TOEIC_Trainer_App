server:
  port: ${PORT:8080}

spring:
  application:
    name: toeic-trainer-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:5432/postgres?sslmode=require}
    username: ${DB_USER:postgres.aouwgrbxgdrozgicyoli}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 22MB

app:
  jwt:
    # NEVER commit a real secret. Set JWT_SECRET env var in production.
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-min-32-chars-1234567890}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    reset-token-expiration-ms: 1800000 # 30 minutes
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  speechify:
    api-key: ${SPEECHIFY_API_KEY:}
    api-url: https://api.speechify.ai/v1/audio/speech
    model: simba-3.2
  ai:
    api-key: ${AI_API_KEY:}
    api-base: ${AI_API_BASE:https://generativelanguage.googleapis.com/v1beta}
    model: ${AI_MODEL:gemini-3.1-flash-lite}
    daily-char-limit: ${AI_DAILY_CHAR_LIMIT:200000}
    vision-model: ${AI_VISION_MODEL:gemini-3.1-flash-lite}
  storage-dir: ${STORAGE_DIR:./uploads}

logging:
  level:
    com.toeictrainer: INFO
    org.hibernate.SQL: WARN
